<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作管理後台 · 資訊專員</title>
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --card2:#f8fafc; --line:#e2e8f0;
    --ink:#0f172a; --sub:#64748b; --muted:#94a3b8; --dash:#cbd5e1;
    --page:#eef2f7; --input:#ffffff; --hover:#f1f5f9;
    --brand:#0d9488; --brand-d:#0f766e; --brand-l:#ccfbf1;
    --amber:#d97706; --amber-l:#fef3c7;
    --red:#dc2626; --red-l:#fee2e2; --green:#16a34a; --green-l:#dcfce7;
    --done:#f4fbf7;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(15,23,42,.06);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0b1120; --card:#161f31; --card2:#1c2740; --line:#2a3650;
    --ink:#e6edf7; --sub:#94a6c0; --muted:#64748b; --dash:#3b475e;
    --page:#0a101c; --input:#0f1727; --hover:#1c2740;
    --brand:#2dd4bf; --brand-d:#14b8a6; --brand-l:#5eead4;
    --amber:#fbbf24; --amber-l:#3a2f12;
    --red:#f87171; --red-l:#3a1a1a; --green:#4ade80; --green-l:#12301f;
    --done:#141f19;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    background:var(--page);color:var(--ink);font-size:15px;line-height:1.5;
    transition:background .25s,color .25s}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}

  /* ---------- Header ---------- */
  header{background:var(--bg);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(0,0,0,.2)}
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:1200px;margin:0 auto}
  .hbar .logo{font-size:19px;font-weight:700;white-space:nowrap}
  .hbar .logo span{color:#5eead4}
  .hbar .sp{flex:1}
  .hbar .who{color:#8aa0bd;font-size:13px}
  .hbar .out{color:#cbd5e1;font-size:13px;padding:7px 11px;border:1px solid #334155;border-radius:9px;
    display:inline-flex;align-items:center;gap:5px;transition:background .15s}
  .hbar .out:hover{background:#1e293b}
  .hbar .out.icon{padding:7px 9px;font-size:16px;line-height:1}
  nav{display:flex;gap:2px;padding:0 12px;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{display:flex;align-items:center;gap:6px;color:#94a3b8;padding:13px 16px;font-size:15px;
    font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
  nav button .ico{font-size:16px;line-height:1}
  nav button:hover{color:#cbd5e1}
  nav button .badge{background:#334155;color:#cbd5e1;border-radius:20px;font-size:11px;padding:1px 7px;
    min-width:20px;text-align:center}
  nav button.active{color:#fff;border-bottom-color:var(--brand)}
  nav button.active .badge{background:var(--brand);color:#04211d}

  /* ---------- Layout ---------- */
  main{max-width:1200px;margin:0 auto;padding:20px 18px 80px}
  .view{display:none}.view.active{display:block}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar h2{margin:0;font-size:19px;flex-shrink:0}
  .toolbar .desc{color:var(--sub);font-size:13px;width:100%;margin:-6px 0 4px}
  .grow{flex:1}
  .btn{padding:9px 15px;background:var(--brand);color:#fff;border-radius:9px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--brand-d)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--card2)}
  select.filter,input.search{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--ink)}
  input.search{min-width:180px}
  .chips{display:flex;gap:6px}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:13px;color:var(--sub);font-weight:600}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .dash{color:var(--dash)}

  /* ---------- Table card ---------- */
  .tablewrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
  th{background:var(--card2);color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.4px;white-space:nowrap;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  tr.done{background:var(--done)}
  tr.done td.maincol{color:var(--muted);text-decoration:line-through}
  td.act{white-space:nowrap;text-align:right}
  .iconbtn{padding:5px 9px;border-radius:7px;font-size:13px;color:var(--sub)}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}
  .iconbtn.del:hover{background:var(--red-l);color:var(--red)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px}

  /* status pill toggles */
  .pill{border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .pill.no{background:var(--amber-l);color:var(--amber)}
  .pill.yes{background:var(--green-l);color:var(--green)}
  .pill:hover{filter:brightness(.96)}
  .tag{display:inline-block;background:var(--card2);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  .tag.warn{background:var(--amber-l);color:var(--amber)}
  .qty{font-variant-numeric:tabular-nums;font-weight:600}

  /* summary strip */
  .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 18px;min-width:110px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .stat.a .n{color:var(--brand)} .stat.b .n{color:var(--amber)} .stat.c .n{color:var(--green)}

  /* 訂貨分組表頭 */
  tr.grouphdr td{background:var(--card2);border-bottom:2px solid var(--brand);padding:10px 15px}
  .ghd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
  .gno{font-weight:800;font-size:15px}
  .gmeta{color:var(--sub);font-size:13px}
  .gsub{margin-left:auto;font-weight:700;color:var(--brand)}
  .gprog{font-size:12px;font-weight:700;background:var(--amber-l);color:var(--amber);padding:2px 10px;border-radius:20px}
  .gprog.done{background:var(--green-l);color:var(--green)}

  /* 多品項輸入 */
  .ohead,.oitem{display:grid;grid-template-columns:minmax(0,1fr) 58px 66px 62px 26px;gap:6px;align-items:center}
  .ohead{font-size:11px;color:var(--sub);font-weight:700;padding:0 2px 2px}
  .ohead span:nth-child(n+2){text-align:right}
  .oitem{margin-bottom:6px}
  .oitem input{padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);width:100%;font-size:14px}
  .oitem input.oi-qty,.oitem input.oi-price{text-align:right}
  .oi-total{font-size:13px;font-weight:700;text-align:right;color:var(--ink)}
  .oi-del{color:var(--muted);font-size:16px;padding:2px;text-align:center}
  .oi-del:hover{color:var(--red)}
  #oAdd{margin-top:2px}
  .ototal{text-align:right;font-size:14px;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line);color:var(--sub)}
  .ototal b{color:var(--brand);font-size:19px;margin-left:6px}

  /* ---------- Modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;
    justify-content:center;z-index:60;padding:30px 16px;overflow-y:auto}
  #modal.on{display:flex}
  .mcard{background:var(--card);border-radius:16px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .mhead h3{margin:0;font-size:18px}
  .mhead .x{margin-left:auto;font-size:22px;color:var(--muted);padding:0 6px}
  .mbody{padding:20px 22px;display:grid;gap:14px}
  .fld,.col{display:flex;flex-direction:column;gap:5px}
  .fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mbody label{font-size:13px;font-weight:600;color:var(--sub)}
  .mbody input,.mbody select,.mbody textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;width:100%;background:var(--input);color:var(--ink)}
  .mbody input:focus,.mbody select:focus,.mbody textarea:focus{outline:none;border-color:var(--brand)}
  .mbody textarea{resize:vertical;min-height:60px}
  .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:90;
    opacity:0;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .loading{text-align:center;padding:50px;color:var(--muted)}

  @media(max-width:640px){
    .hbar .who{display:none}
    .hbar{padding:11px 14px;gap:8px}
    .hbar .logo{font-size:17px}
    main{padding:14px 12px 90px}

    /* 導覽：四等分、圖示在上、文字在下 */
    nav{gap:0;padding:0}
    nav button{position:relative;flex:1;flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:11px;justify-content:center}
    nav button .ico{font-size:21px}
    nav button .badge{position:absolute;top:4px;left:50%;transform:translateX(3px);padding:0 5px;min-width:17px;font-size:10px;line-height:16px;height:16px}

    /* 工具列 */
    .toolbar{gap:8px}
    .toolbar h2{width:100%}
    .toolbar .desc{margin:-4px 0 2px}
    .grow{display:none}
    .toolbar .btn{width:100%;justify-content:center;padding:12px}
    .toolbar select.filter{flex:1 1 auto}
    .toolbar input.search{flex:1 1 100%;width:100%;min-width:0}
    .chips{flex:1 1 100%}
    .chips .chip{flex:1;text-align:center}

    /* 統計：三等分 */
    .summary{gap:8px}
    .summary .stat{flex:1;min-width:0;padding:12px 8px;text-align:center}
    .stat .n{font-size:21px}

    /* 表格 → 卡片 */
    .tablewrap{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
    .scroll{overflow:visible}
    table{min-width:0;width:100%;display:block}
    thead{display:none}
    tbody{display:block}
    tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
    tr.done{background:var(--done)}
    td{display:flex;justify-content:space-between;align-items:center;gap:14px;
       padding:10px 15px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}
    tr td:last-child{border-bottom:0}
    td::before{content:attr(data-label);color:var(--sub);font-size:12px;font-weight:700;
       text-align:left;flex-shrink:0;white-space:nowrap}
    /* 主欄位當卡片標題（整行、無標籤） */
    td.maincol{display:block;text-align:left;font-size:16px;font-weight:700;
       background:var(--card2);padding:12px 15px}
    tr.done td.maincol{background:var(--done)}
    td.maincol::before{display:none}
    /* 操作列 */
    td.act{justify-content:flex-end;gap:8px;background:var(--card2)}
    td.act::before{display:none}
    td.act .iconbtn{padding:8px 14px;font-size:16px;border:1px solid var(--line)}
    /* 空狀態 */
    td[colspan]{display:block;text-align:center}
    td[colspan]::before{display:none}
    .empty{padding:36px 16px}

    .fld.row2{grid-template-columns:1fr 1fr}
    #modal{padding:0;align-items:flex-end}
    .mcard{max-width:none;border-radius:18px 18px 0 0}
  }
</style>
</head>
<body>

<!-- ===== App ===== -->
<div id="app">
  <header>
    <div class="hbar">
      <div class="logo">🗂️ 工作管理<span>後台</span></div>
      <div class="sp"></div>
      <div class="who" id="who">線上同步中 ✓</div>
      <button class="out icon" id="themeBtn" onclick="toggleTheme()" title="切換深／淺主題">🌙</button>
    </div>
    <nav id="nav">
      <button data-tab="tasks" class="active" onclick="go('tasks')"><span class="ico">📌</span><span class="lbl">交代事項</span><span class="badge" id="bTasks">0</span></button>
      <button data-tab="orders" onclick="go('orders')"><span class="ico">📦</span><span class="lbl">訂貨追蹤</span><span class="badge" id="bOrders">0</span></button>
      <button data-tab="uniforms" onclick="go('uniforms')"><span class="ico">👕</span><span class="lbl">制服申請</span><span class="badge" id="bUniforms">0</span></button>
      <button data-tab="assets" onclick="go('assets')"><span class="ico">🏷️</span><span class="lbl">資材保管</span><span class="badge" id="bAssets">0</span></button>
    </nav>
  </header>

  <main>
    <!-- ===== 1. 主管交代 ===== -->
    <section class="view active" id="v-tasks">
      <div class="toolbar">
        <h2>📌 交代事項</h2>
        <div class="desc">記錄誰、哪天交代、要處理什麼；點狀態即可切換已處理／未處理。</div>
        <div class="chips" id="fltTasks">
          <button class="chip on" data-f="pending">待處理</button>
          <button class="chip" data-f="all">全部</button>
          <button class="chip" data-f="done">已處理</button>
        </div>
        <div class="grow"></div>
        <button class="btn" onclick="openForm('tasks')">＋ 新增交代</button>
      </div>
      <div class="summary" id="sumTasks"></div>
      <div class="tablewrap"><div class="scroll"><table id="tbTasks"></table></div></div>
    </section>

    <!-- ===== 2. 訂貨追蹤 ===== -->
    <section class="view" id="v-orders">
      <div class="toolbar">
        <h2>📦 訂貨追蹤</h2>
        <div class="desc">依「原表單編號」分組；一張表單可含多筆品項，總價自動計算，每筆各自標記到貨。</div>
        <select class="filter" id="monOrders" onchange="render('orders')"></select>
        <div class="chips" id="fltOrders">
          <button class="chip on" data-f="all">全部</button>
          <button class="chip" data-f="pending">未到貨</button>
          <button class="chip" data-f="done">已到貨</button>
        </div>
        <div class="grow"></div>
        <button class="btn" onclick="openForm('orders')">＋ 新增訂貨</button>
      </div>
      <div class="summary" id="sumOrders"></div>
      <div class="tablewrap"><div class="scroll"><table id="tbOrders"></table></div></div>
    </section>

    <!-- ===== 3. 制服申請 ===== -->
    <section class="view" id="v-uniforms">
      <div class="toolbar">
        <h2>👕 員工制服申請</h2>
        <div class="desc">員工申請換制服／褲子，記錄尺寸與件數，逐月追蹤到貨。</div>
        <select class="filter" id="monUniforms" onchange="render('uniforms')"></select>
        <div class="chips" id="fltUniforms">
          <button class="chip on" data-f="all">全部</button>
          <button class="chip" data-f="pending">未到貨</button>
          <button class="chip" data-f="done">已到貨</button>
        </div>
        <div class="grow"></div>
        <button class="btn" onclick="openForm('uniforms')">＋ 新增申請</button>
      </div>
      <div class="summary" id="sumUniforms"></div>
      <div class="tablewrap"><div class="scroll"><table id="tbUniforms"></table></div></div>
    </section>

    <!-- ===== 4. 資材保管 ===== -->
    <section class="view" id="v-assets">
      <div class="toolbar">
        <h2>🏷️ 各單位資材保管</h2>
        <div class="desc">記錄各單位擁有的資材（機號／資產編號）與保管人。</div>
        <select class="filter" id="unitAssets" onchange="render('assets')"></select>
        <input class="search" id="qAssets" placeholder="🔍 搜尋 機號/資產編號/保管人" oninput="render('assets')">
        <div class="grow"></div>
        <button class="btn" onclick="openForm('assets')">＋ 新增資材</button>
      </div>
      <div class="summary" id="sumAssets"></div>
      <div class="tablewrap"><div class="scroll"><table id="tbAssets"></table></div></div>
    </section>
  </main>
</div>

<!-- ===== Modal ===== -->
<div id="modal">
  <div class="mcard">
    <div class="mhead"><h3 id="mTitle">新增</h3><button class="x" onclick="closeModal()">×</button></div>
    <div class="mbody" id="mBody"></div>
    <div class="mfoot">
      <button class="btn ghost" onclick="closeModal()">取消</button>
      <button class="btn" id="mSave" onclick="saveForm()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
/* ============ 設定 ============ */
const SUPABASE_URL = "https://hmqnlovyzlvvnkqmfwtt.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImhtcW5sb3Z5emx2dm5rcW1md3R0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ5NjgxMTAsImV4cCI6MjEwMDU0NDExMH0.epqZ-DZsthezuTjfFGEhosR3hU3v8FgR4w0xnYOHN6s";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

/* ============ 深／淺主題 ============ */
function applyTheme(t){
  document.documentElement.setAttribute('data-theme',t);
  localStorage.setItem('mgr_theme',t);
  const b=document.getElementById('themeBtn');
  if(b){ b.textContent = t==='dark'?'☀️':'🌙'; b.title = t==='dark'?'切換為淺色':'切換為深色'; }
}
function toggleTheme(){
  const cur=document.documentElement.getAttribute('data-theme')==='dark'?'dark':'light';
  applyTheme(cur==='dark'?'light':'dark');
}
(function initTheme(){
  const saved=localStorage.getItem('mgr_theme');
  const sys=window.matchMedia&&window.matchMedia('(prefers-color-scheme:dark)').matches;
  applyTheme(saved || (sys?'dark':'light'));
})();

/* ============ 資料模型 ============ */
const DATA = {tasks:[], orders:[], uniforms:[], assets:[]};
const FILTER = {tasks:'pending', orders:'all', uniforms:'all'};

/* 單位固定排序：發送 → 到著 → 籠車 → 低溫（其餘排最後） */
const UNIT_SEQ = ['發送','到著','籠車','低溫'];
const unitRank = u => { const i = UNIT_SEQ.findIndex(k => (u||'').includes(k)); return i<0 ? 99 : i; };
const byUnitOrder = (a,b) => unitRank(a.unit)-unitRank(b.unit)
  || String(a.unit||'').localeCompare(String(b.unit||''),'zh-Hant')
  || String(a.created_at||'').localeCompare(String(b.created_at||''));

/* 資材專用排序：單位優先，同單位內 → 陳尚福 → PDT → 有保管人 → 匯入順序 */
const isChen   = r => (r.keeper||'').includes('陳尚福') ? 0 : 1;
const isPDT    = r => /PDT/i.test(r.category||'') ? 0 : 1;
const hasKeeper= r => (r.keeper||'').trim() ? 0 : 1;
const byAssetOrder = (a,b) =>
     unitRank(a.unit)-unitRank(b.unit)                                   // 1. 單位固定順序
  || String(a.unit||'').localeCompare(String(b.unit||''),'zh-Hant')
  || isChen(a)-isChen(b)                                                 // 2. 陳尚福優先
  || isPDT(a)-isPDT(b)                                                   // 3. PDT 優先（勝過有無保管人）
  || hasKeeper(a)-hasKeeper(b)                                           // 4. 有保管人優先
  || String(a.created_at||'').localeCompare(String(b.created_at||''));   // 5. 匯入順序

/* 各模組欄位定義（給表單用） */
const SCHEMA = {
  tasks:{ table:'mgr_tasks', title:'交代事項', order:['assign_date','asc'], fields:[
    {k:'assigned_by',l:'交代人',t:'text',req:true,ph:'例：陳尚福'},
    {k:'assign_date',l:'交代日期',t:'date',req:true,def:'today'},

async function loadAll(){ await Promise.all([load('tasks'),load('orders'),load('uniforms'),load('assets')]); }
async function load(m){
  const {table,order} = SCHEMA[m];
  const {data,error} = await sb.from(table).select('*').order(order[0],{ascending:order[1]==='asc'});
  if(error){ toast('讀取失敗：'+error.message); return; }
  DATA[m] = data||[];
  if(m==='orders')   fillMonths('monOrders','order_date','orders');
  if(m==='uniforms') fillMonths('monUniforms','apply_date','uniforms');
  if(m==='assets')   fillUnits();
  render(m); updateBadges();
}
function updateBadges(){
  document.getElementById('bTasks').textContent    = DATA.tasks.filter(r=>!r.done).length;
  document.getElementById('bOrders').textContent   = DATA.orders.filter(r=>!r.arrived).length;
  document.getElementById('bUniforms').textContent = DATA.uniforms.filter(r=>!r.arrived).length;
  document.getElementById('bAssets').textContent   = DATA.assets.length;
}

/* 月份 / 單位下拉 */
function fillMonths(selId,dateKey,m){
  const sel=document.getElementById(selId);
  const months=[...new Set(DATA[m].map(r=>(r[dateKey]||'').slice(0,7)).filter(Boolean))].sort().reverse();
  const cur=sel.value;
  sel.innerHTML='<option value="all">全部月份</option>'+months.map(x=>`<option value="${x}">${x.replace('-','年')}月</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}
function fillUnits(){
  const sel=document.getElementById('unitAssets');
  const units=[...new Set(DATA.assets.map(r=>r.unit).filter(Boolean))]
    .sort((a,b)=>unitRank(a)-unitRank(b)||a.localeCompare(b,'zh-Hant'));
  const cur=sel.value;
  sel.innerHTML='<option value="all">全部單位</option>'+units.map(u=>`<option value="${u}">${u}</option>`).join('');
  if([...sel.options].some(o=>o.value===cur)) sel.value=cur;
}

  const groups=new Map();

        <span class="gprog ${g.arr===g.total?'done':''}">到貨 ${g.arr}/${g.total}</span>
      </div></td></tr>`;
    html+=items.map(r=>`<tr class="${r.arrived?'done':''}">
        <td class="maincol">${esc(r.item)}</td>
        <td class="qty" data-label="數量">${r.quantity!=null?esc(r.quantity):'<span class="dash">—</span>'}</td>
        <td class="qty" data-label="單價">${money(r.unit_price)}</td>

        <td data-label="到貨"><button class="pill ${r.arrived?'yes':'no'}" onclick="toggle('orders','${r.id}','arrived',${!r.arrived})">${r.arrived?'✓ 已到貨':'未到貨'}</button></td>

}

async function toggle(m,id,field,val){
  const {error}=await sb.from(SCHEMA[m].table).update({[field]:val}).eq('id',id);
  if(error){toast('更新失敗：'+error.message);return;}
  const r=DATA[m].find(x=>x.id===id); if(r)r[field]=val;

}

let editing={m:null,id:null};
function openForm(m,id=null){
  if(m==='orders' && !id) return openOrderForm();   // 新增訂貨→多品項表單
  editing={m,id};
  const s=SCHEMA[m];
  const rec=id?DATA[m].find(r=>r.id===id):{};
  document.getElementById('mSave').onclick=saveForm;
  document.getElementById('mTitle').textContent=(id?'編輯':'新增')+s.title;
  const today=new Date().toISOString().slice(0,10);
  const fieldHtml=f=>{
    let val=rec[f.k]; if(val==null)val=f.def==='today'?today:(f.def!=null?f.def:'');
    const id2='f_'+f.k;
    let ctl;
    if(f.t==='textarea')ctl=`<textarea id="${id2}" placeholder="${f.ph||''}">${esc(val)}</textarea>`;
    else if(f.t==='select')ctl=`<select id="${id2}">${f.opts.map(o=>`<option ${o===val?'selected':''}>${o}</option>`).join('')}</select>`;
    else ctl=`<input id="${id2}" type="${f.t}" placeholder="${f.ph||''}" value="${esc(val)}">`;
    const lab=`<label>${f.l}${f.req?' <span style=color:#dc2626>*</span>':''}</label>`;
    return {inner:lab+ctl};
  };
  /* 依序輸出；相鄰兩個 row2 欄位併成一列 */
  let html='',i=0;
  while(i<s.fields.length){
    const f=s.fields[i];
    if(f.row2 && s.fields[i+1] && s.fields[i+1].row2){
      html+=`<div class="fld row2"><div class="col">${fieldHtml(f).inner}</div><div class="col">${fieldHtml(s.fields[i+1]).inner}</div></div>`;
      i+=2;
    }else{
      html+=`<div class="fld">${fieldHtml(f).inner}</div>`;
      i++;
    }
  }
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

async function saveForm(){
  const {m,id}=editing; const s=SCHEMA[m]; const obj={};
  for(const f of s.fields){
    let v=document.getElementById('f_'+f.k).value;
    if(f.req&&!String(v).trim()){toast('請填寫「'+f.l+'」');return;}
    if(f.t==='number')v=v===''?null:Number(v);
    if(v==='')v=null;
    obj[f.k]=v;
  }
  if(m==='orders') obj.total_price=(obj.quantity!=null&&obj.unit_price!=null)?obj.quantity*obj.unit_price:null;
  const btn=document.getElementById('mSave');btn.disabled=true;btn.textContent='儲存中…';
  let error;
  if(id){({error}=await sb.from(s.table).update(obj).eq('id',id));}
  else{({error}=await sb.from(s.table).insert(obj));}
  btn.disabled=false;btn.textContent='儲存';
  if(error){toast('儲存失敗：'+error.message);return;}
  closeModal();await load(m);toast(id?'已更新 ✓':'已新增 ✓');
}

function orderAddItem(){
  const c=document.getElementById('oItems');
  const d=document.createElement('div');
  d.className='oitem'; d.dataset.i=orderItemSeq++;
  d.innerHTML=`<input class="oi-name" placeholder="品名">
    <input class="oi-qty" type="number" min="0" step="any" placeholder="數量">
    <input class="oi-price" type="number" min="0" step="any" placeholder="單價">
    <span class="oi-total">$0</span>
    <button class="oi-del" type="button" title="移除">✕</button>`;
  c.appendChild(d);
  d.querySelector('.oi-del').onclick=()=>{d.remove();orderRecalc();};
  d.querySelectorAll('.oi-qty,.oi-price').forEach(el=>el.addEventListener('input',orderRecalc));

function orderRecalc(){
  let sum=0;
  document.querySelectorAll('#oItems .oitem').forEach(d=>{
    const q=Number(d.querySelector('.oi-qty').value)||0;
    const p=Number(d.querySelector('.oi-price').value)||0;
    const t=q*p; sum+=t;
    d.querySelector('.oi-total').textContent='$'+t.toLocaleString();
  });
  document.getElementById('oTotal').textContent='$'+sum.toLocaleString();
}
async function saveOrderMulti(){
  const date=document.getElementById('oDate').value;
  const form=document.getElementById('oForm').value.trim();
  const po=document.getElementById('oPo').value.trim()||null;
  if(!date){toast('請選訂貨日期');return;}
  if(!form){toast('請填原表單編號');return;}
  const items=[];
  document.querySelectorAll('#oItems .oitem').forEach(d=>{
    const name=d.querySelector('.oi-name').value.trim();
    if(!name)return;
    const q=d.querySelector('.oi-qty').value, p=d.querySelector('.oi-price').value;
    const qn=q===''?null:Number(q), pn=p===''?null:Number(p);
    items.push({form_no:form,order_date:date,po_no:po,item:name,quantity:qn,unit_price:pn,
      total_price:(qn!=null&&pn!=null)?qn*pn:null,arrived:false});
  });
  if(!items.length){toast('請至少填一筆品項（品名必填）');return;}
  const btn=document.getElementById('mSave');btn.disabled=true;btn.textContent='儲存中…';
  const {error}=await sb.from('mgr_orders').insert(items);
  btn.disabled=false;btn.textContent='儲存';
  if(error){toast('儲存失敗：'+error.message);return;}
  closeModal();await load('orders');toast(`已新增 ${items.length} 筆品項 ✓`);
}

/* ============ 刪除 ============ */
async function del(m,id){
  if(!confirm('確定要刪除這筆資料嗎？'))return;
  const {error}=await sb.from(SCHEMA[m].table).delete().eq('id',id);
  if(error){toast('刪除失敗：'+error.message);return;}
  await load(m);toast('已刪除');
}

/* ============ Toast ============ */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);
}
</script>

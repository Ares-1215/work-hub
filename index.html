<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="彰化轉運中心資訊專員工作管理後台：交代事項、訂貨追蹤、制服申請、資材保管">
<title>工作管理後台 · 資訊專員</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🗂️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f172a; --card:#ffffff; --card2:#f8fafc; --line:#e2e8f0;
    --ink:#0f172a; --sub:#64748b; --muted:#94a3b8; --dash:#cbd5e1;
    --page:#eef2f7; --input:#ffffff; --hover:#f1f5f9;
    --brand:#0d9488; --brand-d:#0f766e; --brand-l:#ccfbf1;
    --amber:#d97706; --amber-l:#fef3c7;
    --red:#dc2626; --red-l:#fee2e2; --green:#16a34a; --green-l:#dcfce7;
    --done:#f4fbf7;
    --radius:14px; --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(15,23,42,.06);
    color-scheme:light;
  }
  :root[data-theme="dark"]{
    --bg:#0b1120; --card:#161f31; --card2:#1c2740; --line:#2a3650;
    --ink:#e6edf7; --sub:#94a6c0; --muted:#64748b; --dash:#3b475e;
    --page:#0a101c; --input:#0f1727; --hover:#1c2740;
    --brand:#2dd4bf; --brand-d:#14b8a6; --brand-l:#5eead4;
    --amber:#fbbf24; --amber-l:#3a2f12;
    --red:#f87171; --red-l:#3a1a1a; --green:#4ade80; --green-l:#12301f;
    --done:#141f19;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.4);
    color-scheme:dark;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{font-family:"Noto Sans TC","Segoe UI","Microsoft JhengHei","PingFang TC",system-ui,sans-serif;
    background:var(--page);color:var(--ink);font-size:15px;line-height:1.55;
    transition:background .25s,color .25s}
  button{font-family:inherit;cursor:pointer;border:0;background:none}
  input,select,textarea{font-family:inherit;font-size:15px}
  :focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:4px}
  .btn,.chip,.pill,.iconbtn,.gbtn,.out{transition:background .18s,color .18s,border-color .18s,transform .12s,box-shadow .18s}
  .btn:active,.chip:active,.pill:active,.gbtn:active{transform:scale(.96)}
  .iconbtn:active{transform:scale(.9)}

  /* ---------- Header ---------- */
  header{background:var(--bg);color:#fff;position:sticky;top:0;z-index:40;box-shadow:0 2px 12px rgba(0,0,0,.2)}
  .hbar{display:flex;align-items:center;gap:10px;padding:12px 18px;max-width:1200px;margin:0 auto}
  .hbar .logo{font-size:19px;font-weight:700;white-space:nowrap}
  .hbar .logo span{color:#5eead4}
  .hbar .sp{flex:1}
  .hbar .who{color:#8aa0bd;font-size:13px}
  .hbar .out{color:#cbd5e1;font-size:13px;padding:7px 11px;border:1px solid #334155;border-radius:9px;
    display:inline-flex;align-items:center;gap:5px;transition:background .15s}
  .hbar .out:hover{background:#1e293b}
  .hbar .out.icon{padding:7px 9px;font-size:16px;line-height:1}
  nav{display:flex;gap:2px;padding:0 12px;max-width:1200px;margin:0 auto;overflow-x:auto;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{display:flex;align-items:center;gap:6px;color:#94a3b8;padding:13px 16px;font-size:15px;
    font-weight:600;white-space:nowrap;border-bottom:3px solid transparent;transition:color .15s}
  nav button .ico{font-size:16px;line-height:1}
  nav button:hover{color:#cbd5e1}
  nav button .badge{background:#334155;color:#cbd5e1;border-radius:20px;font-size:11px;padding:1px 7px;
    min-width:20px;text-align:center}
  nav button.active{color:#fff;border-bottom-color:var(--brand)}
  nav button.active .badge{background:var(--brand);color:#04211d}

  /* ---------- Layout ---------- */
  main{max-width:1200px;margin:0 auto;padding:20px 18px 80px}
  .view{display:none}.view.active{display:block;animation:viewin .28s ease}
  @keyframes viewin{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
  .toolbar h2{margin:0;font-size:20px;font-weight:800;letter-spacing:-.2px;flex-shrink:0;text-wrap:balance}
  .toolbar .desc{color:var(--sub);font-size:13px;width:100%;margin:-6px 0 4px}
  .grow{flex:1}
  .btn{padding:9px 15px;background:var(--brand);color:#fff;border-radius:9px;font-weight:600;font-size:14px;
    display:inline-flex;align-items:center;gap:6px}
  .btn:hover{background:var(--brand-d)}
  .btn.sm{padding:6px 11px;font-size:13px}
  .btn.ghost{background:var(--card);color:var(--ink);border:1px solid var(--line)}
  .btn.ghost:hover{background:var(--card2)}
  select.filter,input.search{padding:8px 11px;border:1px solid var(--line);border-radius:9px;background:var(--input);color:var(--ink)}
  input.search{min-width:180px}
  .chips{display:flex;gap:6px}
  .chip{padding:7px 13px;border:1px solid var(--line);border-radius:20px;background:var(--card);font-size:13px;color:var(--sub);font-weight:600}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .dash{color:var(--dash)}

  /* ---------- Table card ---------- */
  .tablewrap{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);overflow:hidden}
  .scroll{overflow-x:auto}
  table{width:100%;border-collapse:collapse;min-width:640px}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--line);vertical-align:middle;font-size:14px}
  th{background:var(--card2);color:var(--sub);font-size:12px;font-weight:700;letter-spacing:.4px;white-space:nowrap;position:sticky;top:0}
  tr:last-child td{border-bottom:0}
  tr.done{background:var(--done)}
  tr.done td.maincol{color:var(--muted);text-decoration:line-through}
  td.act{white-space:nowrap;text-align:right}
  .iconbtn{padding:5px 9px;border-radius:7px;font-size:13px;color:var(--sub)}
  .iconbtn:hover{background:var(--hover);color:var(--ink)}
  .iconbtn.del:hover{background:var(--red-l);color:var(--red)}
  .empty{padding:50px 20px;text-align:center;color:var(--muted)}
  .empty .big{font-size:40px;margin-bottom:8px}

  /* status pill toggles */
  .pill{border-radius:20px;padding:5px 12px;font-size:13px;font-weight:600;white-space:nowrap}
  .pill.no{background:var(--amber-l);color:var(--amber)}
  .pill.yes{background:var(--green-l);color:var(--green)}
  .pill:hover{filter:brightness(.96)}
  .tag{display:inline-block;background:var(--card2);color:var(--sub);border-radius:6px;padding:2px 8px;font-size:12px;font-weight:600}
  .tag.warn{background:var(--amber-l);color:var(--amber)}
  /* 單位色標：發送=淡紅 到著=淡黃 籠車=淡灰 低溫=淡藍 */
  .tag.u-send{background:#fee2e2;color:#b91c1c}
  .tag.u-arrive{background:#fef3c7;color:#a16207}
  .tag.u-cage{background:#e5e7eb;color:#4b5563}
  .tag.u-cold{background:#dbeafe;color:#1d4ed8}
  :root[data-theme="dark"] .tag.u-send{background:#3a1a1a;color:#fca5a5}
  :root[data-theme="dark"] .tag.u-arrive{background:#3a2f12;color:#fcd34d}
  :root[data-theme="dark"] .tag.u-cage{background:#313c52;color:#cbd5e1}
  :root[data-theme="dark"] .tag.u-cold{background:#17263f;color:#93c5fd}
  .qty{font-variant-numeric:tabular-nums;font-weight:600}

  /* 狀態標籤（資材） */
  .tag.st-repair{background:var(--red-l);color:var(--red)}
  .tag.st-repairing{background:var(--amber-l);color:var(--amber)}
  .tag.st-ok{background:var(--green-l);color:var(--green)}

  /* ---------- 總覽儀表板 ---------- */
  .hero{margin:2px 0 18px}
  .hero h1{margin:0;font-size:25px;font-weight:900;letter-spacing:-.3px}
  .hero p{margin:3px 0 0;color:var(--sub);font-size:14px}
  .homegrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
  .hcard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px 16px 14px;
    box-shadow:var(--shadow);cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:2px;
    transition:transform .18s,box-shadow .18s,border-color .18s}
  .hcard:hover{transform:translateY(-2px);border-color:var(--brand)}
  .hcard:active{transform:scale(.98)}
  .hcard .hi{font-size:20px;margin-bottom:4px}
  .hcard .hn{font-size:27px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1.1}
  .hcard .hl{font-size:13px;color:var(--sub);font-weight:600}
  .hcard .hs{font-size:12px;color:var(--muted);margin-top:2px}
  .hcard.ok .hn{color:var(--green)} .hcard.warn .hn{color:var(--amber)}
  .hcard.bad .hn{color:var(--red)} .hcard.info .hn{color:var(--brand)}
  .homepanels{display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:12px}
  .hpanel{background:var(--card);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px}
  .hpanel h3{margin:0 0 8px;font-size:14px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:6px}
  .hpanel .more{margin-left:auto;font-size:12px;color:var(--brand);font-weight:600;cursor:pointer}
  .hrow{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer;border-radius:6px}
  .hrow:hover{background:var(--hover)}
  .hrow:last-child{border-bottom:0}
  .hrow .hd{color:var(--muted);font-size:12px;white-space:nowrap;font-variant-numeric:tabular-nums}
  .hrow .hw{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .hrow .hb{color:var(--sub);font-size:12px;white-space:nowrap}
  .hempty{color:var(--muted);font-size:13px;padding:14px 2px;text-align:center}

  /* 訂貨月費用趨勢 */
  .trend{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
  .trend h3{margin:0 0 12px;font-size:14px;color:var(--sub);font-weight:700}
  .tbars{display:flex;align-items:flex-end;gap:10px;height:110px}
  .tcol{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;cursor:pointer}
  .tbar{width:100%;max-width:52px;background:linear-gradient(180deg,var(--brand),var(--brand-d));border-radius:6px 6px 2px 2px;
    min-height:3px;transition:filter .15s,transform .15s;transform-origin:bottom}
  .tcol:hover .tbar{filter:brightness(1.12);transform:scaleY(1.02)}
  .tcol.cur .tbar{outline:2px solid var(--brand);outline-offset:2px}
  .tv{font-size:11px;font-weight:700;color:var(--sub);font-variant-numeric:tabular-nums;white-space:nowrap}
  .tm{font-size:11px;color:var(--muted);white-space:nowrap}

  /* 盤點模式 */
  .invbar{background:var(--amber-l);border:1px solid var(--amber);border-radius:12px;padding:12px 14px;
    margin-bottom:14px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;font-size:14px}
  .invbar .msg{flex:1;min-width:200px;color:var(--ink)}
  .invbar b{color:var(--amber)}
  .invchk{border-radius:20px;padding:5px 14px;font-size:13px;font-weight:700;border:1.5px solid var(--line);
    background:var(--card);color:var(--muted);white-space:nowrap}
  .invchk.on{background:var(--green-l);color:var(--green);border-color:var(--green)}

  /* ---------- 全站搜尋 ---------- */
  #searchOv{position:fixed;inset:0;background:rgba(10,16,28,.6);backdrop-filter:blur(2px);
    display:none;z-index:70;padding:60px 16px 20px;overflow-y:auto}
  #searchOv.on{display:flex;flex-direction:column;align-items:center;animation:ovin .18s ease}
  .sbox{background:var(--card);border-radius:16px;width:100%;max-width:560px;box-shadow:0 20px 60px rgba(0,0,0,.45);
    overflow:hidden;animation:cardin .25s cubic-bezier(.32,.72,.28,1)}
  .sbox .sin{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid var(--line)}
  .sbox .sin input{flex:1;border:0;background:transparent;color:var(--ink);font-size:16px;outline:none}
  .sbox .sin .x{font-size:20px;color:var(--muted);padding:0 4px}
  .sres{max-height:60vh;overflow-y:auto;padding:6px}
  .sgroup{font-size:11px;font-weight:800;color:var(--muted);letter-spacing:1px;padding:10px 12px 4px}
  .sr{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14px}
  .sr:hover{background:var(--hover)}
  .sr .si{font-size:16px}
  .sr .sm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr .ss{color:var(--sub);font-size:12px;white-space:nowrap}
  tr.flash{outline:2px solid var(--brand);outline-offset:-2px}

  /* summary strip */
  .summary{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:16px}
  .stat{background:var(--card);border-radius:12px;box-shadow:var(--shadow);padding:12px 18px;min-width:110px}
  .stat .n{font-size:24px;font-weight:700}
  .stat .l{font-size:12px;color:var(--sub);margin-top:2px}
  .stat.a .n{color:var(--brand)} .stat.b .n{color:var(--amber)} .stat.c .n{color:var(--green)}

  /* 訂貨分組表頭 */
  tr.grouphdr td{background:var(--card2);border-bottom:2px solid var(--brand);padding:10px 15px}
  .ghd{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px}
  .gno{font-weight:800;font-size:15px}
  .gmeta{color:var(--sub);font-size:13px}
  .gsub{margin-left:auto;font-weight:700;color:var(--brand)}
  .gprog{font-size:12px;font-weight:700;background:var(--amber-l);color:var(--amber);padding:2px 10px;border-radius:20px}
  .gprog.done{background:var(--green-l);color:var(--green)}
  .gbtn{font-size:12px;font-weight:600;color:var(--brand);border:1px solid var(--brand);border-radius:8px;padding:3px 9px;background:transparent}
  .gbtn:hover{background:var(--brand);color:#fff}

  /* 各單位當月小計一覽 */
  .unitsum{background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);padding:14px 16px;margin-bottom:16px}
  .unitsum h3{margin:0 0 10px;font-size:14px;color:var(--sub);font-weight:700;display:flex;align-items:center;gap:8px}
  .unitsum table{width:100%;min-width:0;border-collapse:collapse}
  .unitsum th,.unitsum td{padding:8px 6px;border-bottom:1px solid var(--line);font-size:14px;text-align:right}
  .unitsum th{font-size:12px;color:var(--sub);font-weight:700}
  .unitsum th:first-child,.unitsum td:first-child{text-align:left}
  .unitsum tr:last-child td{border-bottom:0}
  .unitsum tr.tot td{font-weight:800;border-top:2px solid var(--line);color:var(--brand)}
  .unitsum .money{font-variant-numeric:tabular-nums;font-weight:700}

  /* 多品項輸入（每筆兩列：品名 / 單位+數量+單價+總價） */
  .oitem{border:1px solid var(--line);border-radius:10px;padding:8px;margin-bottom:8px;background:var(--card2)}
  .oi-r1{display:grid;grid-template-columns:1fr 32px;gap:6px;align-items:center;margin-bottom:6px}
  .oi-r2{display:grid;grid-template-columns:minmax(0,1fr) 52px 62px auto;gap:6px;align-items:center}
  .oitem input,.oitem select{padding:8px;border:1.5px solid var(--line);border-radius:8px;background:var(--input);color:var(--ink);width:100%;font-size:14px}
  .oitem .oi-qty,.oitem .oi-price{text-align:right}
  .oi-total{font-size:13px;font-weight:700;text-align:right;color:var(--ink);white-space:nowrap;min-width:56px}
  .oi-del{color:var(--muted);font-size:15px;padding:7px 0;text-align:center;border:1px solid var(--line);border-radius:8px;background:var(--card)}
  .oi-del:hover{color:var(--red);border-color:var(--red)}
  #oAdd{margin-top:2px}
  .ototal{text-align:right;font-size:14px;padding-top:10px;margin-top:4px;border-top:1px dashed var(--line);color:var(--sub)}
  .ototal b{color:var(--brand);font-size:19px;margin-left:6px}

  /* ---------- Modal ---------- */
  #modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:flex-start;
    justify-content:center;z-index:60;padding:30px 16px;overflow-y:auto}
  #modal.on{display:flex;animation:ovin .2s ease}
  @keyframes ovin{from{opacity:0}}
  .mcard{background:var(--card);border-radius:16px;width:100%;max-width:480px;box-shadow:0 20px 60px rgba(0,0,0,.4);
    animation:cardin .28s cubic-bezier(.32,.72,.28,1)}
  @keyframes cardin{from{opacity:0;transform:translateY(24px) scale(.98)}to{opacity:1;transform:none}}
  .mhead{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}
  .mhead h3{margin:0;font-size:18px}
  .mhead .x{margin-left:auto;font-size:22px;color:var(--muted);padding:0 6px}
  .mbody{padding:20px 22px;display:grid;gap:14px}
  .fld,.col{display:flex;flex-direction:column;gap:5px}
  .fld.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .mbody label{font-size:13px;font-weight:600;color:var(--sub)}
  .mbody input,.mbody select,.mbody textarea{padding:10px 12px;border:1.5px solid var(--line);border-radius:9px;width:100%;background:var(--input);color:var(--ink)}
  .mbody input:focus,.mbody select:focus,.mbody textarea:focus{outline:none;border-color:var(--brand)}
  .mbody textarea{resize:vertical;min-height:60px}
  .mfoot{padding:16px 22px;border-top:1px solid var(--line);display:flex;gap:10px;justify-content:flex-end}

  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);
    background:var(--ink);color:#fff;padding:12px 20px;border-radius:10px;font-size:14px;z-index:90;
    opacity:0;transition:.3s;box-shadow:0 8px 30px rgba(0,0,0,.3)}
  .toast.show{transform:translateX(-50%) translateY(0);opacity:1}
  .loading{text-align:center;padding:50px;color:var(--muted)}

  @media(max-width:640px){
    .hbar .who{display:none}
    .hbar{padding:11px 14px;gap:8px}
    .hbar .logo{font-size:17px}
    main{padding:14px 12px 90px}

    /* 導覽：四等分、圖示在上、文字在下 */
    nav{gap:0;padding:0}
    nav button{position:relative;flex:1;flex-direction:column;gap:3px;padding:9px 2px 8px;font-size:11px;justify-content:center}
    nav button .ico{font-size:21px}
    nav button .badge{position:absolute;top:4px;left:50%;transform:translateX(3px);padding:0 5px;min-width:17px;font-size:10px;line-height:16px;height:16px}

    /* 工具列 */
    .toolbar{gap:8px}
    .toolbar h2{width:100%}
    .toolbar .desc{margin:-4px 0 2px}
    .grow{display:none}
    .toolbar .btn{width:100%;justify-content:center;padding:12px}
    .toolbar select.filter{flex:1 1 auto}
    .toolbar input.search{flex:1 1 100%;width:100%;min-width:0}
    .chips{flex:1 1 100%}
    .chips .chip{flex:1;text-align:center}

    /* 統計：自動 2~3 等分 */
    .summary{gap:8px}
    .summary .stat{flex:1 1 30%;min-width:0;padding:12px 8px;text-align:center}
    .stat .n{font-size:20px}

    /* 總覽 */
    .hero h1{font-size:21px}
    .homegrid{grid-template-columns:1fr 1fr;gap:9px}
    .hcard{padding:13px 13px 11px}
    .hcard .hn{font-size:23px}
    .homepanels{grid-template-columns:1fr}
    nav button{font-size:10px}
    #searchOv{padding:12px 10px}

    /* 表格 → 卡片 */
    .tablewrap{background:transparent;box-shadow:none;border-radius:0;overflow:visible}
    .scroll{overflow:visible}
    table{min-width:0;width:100%;display:block}
    thead{display:none}
    tbody{display:block}
    tr{display:block;background:var(--card);border:1px solid var(--line);border-radius:14px;
       box-shadow:var(--shadow);margin-bottom:12px;overflow:hidden}
    tr.done{background:var(--done)}
    td{display:flex;justify-content:space-between;align-items:center;gap:14px;
       padding:10px 15px;border-bottom:1px solid var(--line);text-align:right;font-size:14px}

  let lastErr;
  for(let i=0;i<3;i++){
    try{ const res=await op(); if(!res||!res.error) return res||{}; lastErr=res.error; }
    catch(e){ lastErr=e; }
    if(i<2){ toast('連線不穩，重試中…'); await new Promise(r=>setTimeout(r,700*(i+1))); }
  }
  return {error:lastErr};
}

function daysSince(d){
  if(!d)return 0;
  const t=new Date(); t.setHours(0,0,0,0);
  return Math.floor((t-new Date(d+'T00:00:00'))/86400000);
}

  if(r.done)return '';

  if(d>=7)return ` <span class="tag st-repair">逾${d}天</span>`;
  if(d>=3)return ` <span class="tag warn">逾${d}天</span>`;
  return '';
}

const money=v=>v==null?'<span class="dash">—</span>':'$'+Number(v).toLocaleString();
let ordGroups=[];
function renderUnitSummary(data, mon){
  const box=document.getElementById('unitSummary');
  if(!data.length){ box.innerHTML=''; return; }
  const map=new Map();
  data.forEach(r=>{
    const k=r.unit||'（未指定）';
    const g=map.get(k)||{amt:0,qty:0,items:0,pend:0};
    g.amt+=Number(r.total_price)||0; g.qty+=Number(r.quantity)||0; g.items++; if(!r.arrived)g.pend++;
    map.set(k,g);
  });
  const order=[...ORDER_UNITS,'（未指定）'];
  const keys=[...map.keys()].sort((a,b)=>{const ia=order.indexOf(a),ib=order.indexOf(b);return (ia<0?99:ia)-(ib<0?99:ib)||a.localeCompare(b,'zh-Hant');});
  const tot={amt:0,qty:0,items:0,pend:0};
  keys.forEach(k=>{const g=map.get(k);tot.amt+=g.amt;tot.qty+=g.qty;tot.items+=g.items;tot.pend+=g.pend;});
  const label=(mon&&mon!=='all')?mon.replace('-','年')+'月':'全部期間';
  box.innerHTML=`<div class="unitsum">
    <h3>📊 各單位小計一覽（${esc(label)}）</h3>
    <table><thead><tr><th>單位</th><th>金額</th><th>數量</th><th>品項</th><th>未到貨</th></tr></thead><tbody>
    ${keys.map(k=>{const g=map.get(k);return `<tr>
      <td>${k==='（未指定）'?'<span class="dash">未指定</span>':unitTag(k)}</td>
      <td class="money">$${g.amt.toLocaleString()}</td>
      <td>${g.qty.toLocaleString()}</td>
      <td>${g.items}</td>
      <td>${g.pend?'<span class="tag warn">'+g.pend+'</span>':'0'}</td></tr>`;}).join('')}
    <tr class="tot"><td>合計</td><td class="money">$${tot.amt.toLocaleString()}</td><td>${tot.qty.toLocaleString()}</td><td>${tot.items}</td><td>${tot.pend}</td></tr>

}
/* 近 6 個月費用趨勢（點長條可切到該月） */
function renderTrend(curMon){
  const box=document.getElementById('ordTrend');
  const now=new Date();
  const months=[];
  for(let i=5;i>=0;i--){
    const d=new Date(now.getFullYear(),now.getMonth()-i,1);
    months.push(`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`);
  }
  const amt=months.map(m=>DATA.orders.filter(r=>(r.order_date||'').slice(0,7)===m)
    .reduce((s,r)=>s+(Number(r.total_price)||0),0));
  if(!amt.some(v=>v>0)){box.innerHTML='';return;}
  const max=Math.max(...amt);
  const short=v=>v>=10000?(v/10000).toFixed(v>=100000?0:1)+'萬':v.toLocaleString();
  box.innerHTML=`<div class="trend"><h3>📈 近 6 個月訂貨費用</h3><div class="tbars">
    ${months.map((m,i)=>`<div class="tcol ${m===curMon?'cur':''}" onclick="pickMonth('${m}')" title="${m}：$${amt[i].toLocaleString()}">
      <span class="tv">${amt[i]?'$'+short(amt[i]):''}</span>
      <div class="tbar" style="height:${max?Math.max(3,Math.round(amt[i]/max*72)):3}px"></div>
      <span class="tm">${Number(m.slice(5))}月</span></div>`).join('')}
  </div></div>`;
}

      </tr>`).join('');
  }
  t.innerHTML=html+`</tbody>`;
}

/* ============ 盤點模式 ============ */
let invMode=false; const invTouched=new Set();
function toggleInv(){
  invMode=!invMode;
  if(invMode)invTouched.clear();
  document.getElementById('invBtn').textContent=invMode?'📋 盤點中…':'📋 盤點模式';
  render('assets');
}
function invToggle(id){
  if(invTouched.has(id))invTouched.delete(id);else invTouched.add(id);
  render('assets');
}
async function finishInv(applyRest){
  if(applyRest){
    /* 目前檢視範圍內、非報修、未勾選 → 未盤點；已勾選 → 正常 */
    const unit=document.getElementById('unitAssets').value;
    const cat=document.getElementById('catAssets').value;
    const grp=FILTER.assets;
    let scope=DATA.assets.filter(r=>r.status!=='repair'&&r.status!=='repairing');
    if(unit&&unit!=='all')scope=scope.filter(r=>r.unit===unit);
    if(grp!=='all')scope=scope.filter(r=>catGroup(r.category)===grp);
    if(cat&&cat!=='all')scope=scope.filter(r=>r.category===cat);
    const okIds=scope.filter(r=>invTouched.has(r.id)).map(r=>r.id);
    const noIds=scope.filter(r=>!invTouched.has(r.id)).map(r=>r.id);
    if(!confirm(`確定結束盤點？\n✔ 已盤 ${okIds.length} 台 → 標「正常」\n☐ 未勾 ${noIds.length} 台 → 標「未盤點」`))return;
    if(okIds.length){const {error}=await dbWrite(()=>sb.from('mgr_assets').update({status:'normal'}).in('id',okIds));if(error){toast('更新失敗：'+errMsg(error));return;}}
    if(noIds.length){const {error}=await dbWrite(()=>sb.from('mgr_assets').update({status:'uninspected'}).in('id',noIds));if(error){toast('更新失敗：'+errMsg(error));return;}}
    toast(`盤點完成：已盤 ${okIds.length}、未盤 ${noIds.length} ✓`);
  }
  invMode=false; invTouched.clear();
  document.getElementById('invBtn').textContent='📋 盤點模式';
  await load('assets');
}

/* ============ 切換狀態 ============ */
async function toggle(m,id,field,val){
  const {error}=await dbWrite(()=>sb.from(SCHEMA[m].table).update({[field]:val}).eq('id',id));
  if(error){toast('更新失敗：'+errMsg(error));return;}
  const r=DATA[m].find(x=>x.id===id); if(r)r[field]=val;
  render(m); updateBadges(); toast(val?'已標記完成 ✓':'已改回未完成');
}

/* ============ 新增 / 編輯 ============ */
let editing={m:null,id:null};
function openForm(m,id=null){
  if(m==='orders' && !id) return openOrderForm();   // 新增訂貨→多品項表單
  editing={m,id};
  const s=SCHEMA[m];
  const rec=id?DATA[m].find(r=>r.id===id):{};
  document.getElementById('mSave').onclick=saveForm;
  document.getElementById('mTitle').textContent=(id?'編輯':'新增')+s.title;
  const today=new Date().toISOString().slice(0,10);
  const fieldHtml=f=>{
    let val=rec[f.k]; if(val==null)val=f.def==='today'?today:(f.def!=null?f.def:'');
    const id2='f_'+f.k;
    let ctl;
    if(f.t==='textarea')ctl=`<textarea id="${id2}" placeholder="${f.ph||''}">${esc(val)}</textarea>`;
    else if(f.t==='select')ctl=`<select id="${id2}">${f.opts.map(o=>{
      const v=(typeof o==='object')?o.v:o, l=(typeof o==='object')?o.l:o;
      return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`;}).join('')}</select>`;
    else ctl=`<input id="${id2}" type="${f.t}" placeholder="${f.ph||''}" value="${esc(val)}">`;
    const lab=`<label>${f.l}${f.req?' <span style=color:#dc2626>*</span>':''}</label>`;
    return {inner:lab+ctl};
  };
  /* 依序輸出；相鄰兩個 row2 欄位併成一列 */
  let html='',i=0;
  while(i<s.fields.length){
    const f=s.fields[i];
    if(f.row2 && s.fields[i+1] && s.fields[i+1].row2){
      html+=`<div class="fld row2"><div class="col">${fieldHtml(f).inner}</div><div class="col">${fieldHtml(s.fields[i+1]).inner}</div></div>`;
      i+=2;
    }else{
      html+=`<div class="fld">${fieldHtml(f).inner}</div>`;
      i++;
    }
  }
  document.getElementById('mBody').innerHTML=html;
  document.getElementById('modal').classList.add('on');
}
function closeModal(){document.getElementById('modal').classList.remove('on');}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});

async function saveForm(){
  const {m,id}=editing; const s=SCHEMA[m]; const obj={};
  for(const f of s.fields){
    let v=document.getElementById('f_'+f.k).value;
    if(f.req&&!String(v).trim()){toast('請填寫「'+f.l+'」');return;}
    if(f.t==='number')v=v===''?null:Number(v);
    if(v==='')v=null;
    obj[f.k]=v;
  }
  if(m==='orders'){
    if(obj.unit==='（未指定）')obj.unit=null;
    obj.total_price=(obj.quantity!=null&&obj.unit_price!=null)?obj.quantity*obj.unit_price:null;
  }
  const btn=document.getElementById('mSave');btn.disabled=true;btn.textContent='儲存中…';
  const {error}=id
    ? await dbWrite(()=>sb.from(s.table).update(obj).eq('id',id))
    : await dbWrite(()=>sb.from(s.table).insert(obj));
  btn.disabled=false;btn.textContent='儲存';
  if(error){toast('儲存失敗：'+errMsg(error));return;}
  closeModal();await load(m);toast(id?'已更新 ✓':'已新增 ✓');
}

/* ============ 新增訂貨：一張表單多品項 ============ */
let orderItemSeq=0;
function openOrderForm(preset){
  editing={m:'orders',id:null};
  const today=new Date().toISOString().slice(0,10);
  const p=preset||{};
  const appending=!!(p.form_no);
  document.getElementById('mTitle').textContent=appending?`新增品項到「${p.form_no}」`:'新增訂貨（一張表單可多筆品項）';
  document.getElementById('mBody').innerHTML=`
    <div class="fld row2">
      <div class="col"><label>訂貨日期 <span style="color:#dc2626">*</span></label><input id="oDate" type="date" value="${esc(p.order_date||today)}"></div>
      <div class="col"><label>採購單號</label><input id="oPo" placeholder="選填" value="${esc(p.po_no||'')}"></div>
    </div>
    <div class="fld"><label>原表單編號 <span style="color:#dc2626">*</span></label><input id="oForm" placeholder="例：A1120-001" value="${esc(p.form_no||'')}"></div>
    <div class="fld"><label>品項（可多筆，每筆可選申請單位，總價自動計算）</label>
      <div id="oItems"></div>
      <button class="btn ghost sm" type="button" id="oAdd">＋ 新增品項</button>
    </div>
    <div class="ototal">本單總金額：<b id="oTotal">$0</b></div>`;
  orderItemSeq=0;
  document.getElementById('oAdd').onclick=()=>orderAddItem();
  orderAddItem(); if(!appending) orderAddItem();   // 追加時預設 1 列，新單 2 列
  document.getElementById('mSave').onclick=saveOrderMulti;
  document.getElementById('modal').classList.add('on');
}
/* 在既有表單追加品項（帶入該表單編號/日期/採購單號） */
function addToForm(i){
  const g=ordGroups[i]; if(!g)return;
  openOrderForm({form_no:g.realForm||'', order_date:g.date, po_no:g.po||''});
}
/* 修改整張表單資訊（套用到該表單所有品項） */
function editFormHeader(i){
  const g=ordGroups[i]; if(!g)return;
  editing={m:'orders',id:null};
  const cnt=DATA.orders.filter(r=>(r.form_no??null)===g.realForm).length;
  document.getElementById('mTitle').textContent='修改表單資訊';
  document.getElementById('mBody').innerHTML=`
    <div class="fld"><label>原表單編號 <span style="color:#dc2626">*</span></label><input id="hForm" value="${esc(g.realForm||'')}"></div>
    <div class="fld row2">
      <div class="col"><label>訂貨日期 <span style="color:#dc2626">*</span></label><input id="hDate" type="date" value="${esc(g.date||'')}"></div>
      <div class="col"><label>採購單號</label><input id="hPo" value="${esc(g.po||'')}"></div>
    </div>
    <div style="font-size:13px;color:var(--sub);background:var(--card2);padding:10px 12px;border-radius:9px">
      ⚠️ 此表單目前有 <b>${cnt}</b> 筆品項，儲存後會<b>一起套用</b>新的編號／日期／採購單號。</div>`;
  document.getElementById('mSave').onclick=()=>saveFormHeader(i);
  document.getElementById('modal').classList.add('on');
}
async function saveFormHeader(i){
  const g=ordGroups[i]; if(!g)return;
  const nf=document.getElementById('hForm').value.trim();
  const nd=document.getElementById('hDate').value;
  const npo=document.getElementById('hPo').value.trim()||null;
  if(!nf){toast('請填原表單編號');return;}
  if(!nd){toast('請選訂貨日期');return;}
  const btn=document.getElementById('mSave');btn.disabled=true;btn.textContent='儲存中…';
  const {error}=await dbWrite(()=>{
    let q=sb.from('mgr_orders').update({form_no:nf,order_date:nd,po_no:npo});
    return g.realForm==null?q.is('form_no',null):q.eq('form_no',g.realForm);
  });
  btn.disabled=false;btn.textContent='儲存';
  if(error){toast('儲存失敗：'+errMsg(error));return;}
  closeModal();await load('orders');toast('已更新整張表單 ✓');
}
function orderAddItem(){
  const c=document.getElementById('oItems');
  const d=document.createElement('div');
  d.className='oitem'; d.dataset.i=orderItemSeq++;
  d.innerHTML=`<div class="oi-r1">
      <input class="oi-name" placeholder="品名">
      <button class="oi-del" type="button" title="移除此品項">✕</button>
    </div>
    <div class="oi-r2">
      <select class="oi-unit"><option value="">（選單位）</option>${ORDER_UNITS.map(u=>`<option value="${u}">${u}</option>`).join('')}</select>
      <input class="oi-qty" type="number" min="0" step="any" placeholder="數量">
      <input class="oi-price" type="number" min="0" step="any" placeholder="單價">
      <span class="oi-total">$0</span>
    </div>`;
  c.appendChild(d);
  d.querySelector('.oi-del').onclick=()=>{d.remove();orderRecalc();};
  d.querySelectorAll('.oi-qty,.oi-price').forEach(el=>el.addEventListener('input',orderRecalc));
}
function orderRecalc(){
  let sum=0;
  document.querySelectorAll('#oItems .oitem').forEach(d=>{
    const q=Number(d.querySelector('.oi-qty').value)||0;
    const p=Number(d.querySelector('.oi-price').value)||0;
    const t=q*p; sum+=t;
    d.querySelector('.oi-total').textContent='$'+t.toLocaleString();
  });
  document.getElementById('oTotal').textContent='$'+sum.toLocaleString();
}
async function saveOrderMulti(){
  const date=document.getElementById('oDate').value;
  const form=document.getElementById('oForm').value.trim();
  const po=document.getElementById('oPo').value.trim()||null;
  if(!date){toast('請選訂貨日期');return;}
  if(!form){toast('請填原表單編號');return;}
  const items=[];
  document.querySelectorAll('#oItems .oitem').forEach(d=>{
    const name=d.querySelector('.oi-name').value.trim();
    if(!name)return;
    const q=d.querySelector('.oi-qty').value, p=d.querySelector('.oi-price').value;
    const qn=q===''?null:Number(q), pn=p===''?null:Number(p);
    const u=d.querySelector('.oi-unit').value||null;
    items.push({form_no:form,order_date:date,po_no:po,unit:u,item:name,quantity:qn,unit_price:pn,
      total_price:(qn!=null&&pn!=null)?qn*pn:null,arrived:false});
  });
  if(!items.length){toast('請至少填一筆品項（品名必填）');return;}
  const btn=document.getElementById('mSave');btn.disabled=true;btn.textContent='儲存中…';
  const {error}=await dbWrite(()=>sb.from('mgr_orders').insert(items));
  btn.disabled=false;btn.textContent='儲存';
  if(error){toast('儲存失敗：'+errMsg(error));return;}
  closeModal();await load('orders');toast(`已新增 ${items.length} 筆品項 ✓`);
}

/* ============ 刪除 ============ */
async function del(m,id){
  if(!confirm('確定要刪除這筆資料嗎？'))return;
  const {error}=await dbWrite(()=>sb.from(SCHEMA[m].table).delete().eq('id',id));
  if(error){toast('刪除失敗：'+errMsg(error));return;}
  await load(m);toast('已刪除');
}

/* ============ 全站搜尋 ============ */
function openSearch(){
  document.getElementById('searchOv').classList.add('on');
  const i=document.getElementById('sInput'); i.value=''; doSearch(''); setTimeout(()=>i.focus(),60);
}
function closeSearch(){document.getElementById('searchOv').classList.remove('on');}
document.getElementById('searchOv').addEventListener('click',e=>{if(e.target.id==='searchOv')closeSearch();});
document.addEventListener('keydown',e=>{
  if(e.key==='Escape')closeSearch();
  if((e.ctrlKey||e.metaKey)&&e.key==='k'){e.preventDefault();openSearch();}
});
document.getElementById('sInput').addEventListener('input',e=>doSearch(e.target.value));
function doSearch(q){
  q=q.trim().toLowerCase();
  const box=document.getElementById('sRes');
  if(!q){box.innerHTML='<div class="hempty">輸入關鍵字，一次搜尋四個模組（Ctrl+K 快速開啟）</div>';return;}
  const hit=(r,keys)=>keys.some(k=>(r[k]||'').toString().toLowerCase().includes(q));
  const G=[
    {m:'tasks',ico:'📌',name:'交代事項',rows:DATA.tasks.filter(r=>hit(r,['content','assigned_by','notes'])),
      main:r=>r.content,sub:r=>`${r.assigned_by}・${fmtDate(r.assign_date)}${r.done?'・已處理':''}`},
    {m:'orders',ico:'📦',name:'訂貨追蹤',rows:DATA.orders.filter(r=>hit(r,['item','form_no','po_no','unit','notes'])),
      main:r=>r.item,sub:r=>`${r.form_no||''}・${fmtDate(r.order_date)}${r.arrived?'・已到貨':'・未到貨'}`},
    {m:'uniforms',ico:'👕',name:'制服申請',rows:DATA.uniforms.filter(r=>hit(r,['employee','item_type','size','notes'])),
      main:r=>`${r.employee} ${r.item_type||''}`,sub:r=>`${r.size||''}×${r.quantity||1}・${fmtDate(r.apply_date)}`},
    {m:'assets',ico:'🏷️',name:'資材保管',rows:DATA.assets.filter(r=>hit(r,['machine_no','barcode','asset_no','keeper','category','unit','notes'])),
      main:r=>`${r.category||''} ${r.machine_no||''} ${r.barcode||''}`.trim(),sub:r=>`${r.unit||''}・${r.keeper||'未指定'}`},
  ];
  let html='',total=0;
  for(const g of G){
    if(!g.rows.length)continue;
    total+=g.rows.length;
    html+=`<div class="sgroup">${g.ico} ${g.name}（${g.rows.length}）</div>`;
    html+=g.rows.slice(0,8).map(r=>`<div class="sr" onclick="goHit('${g.m}','${r.id}')">
      <span class="si">${g.ico}</span><span class="sm">${esc(g.main(r))}</span><span class="ss">${esc(g.sub(r))}</span></div>`).join('');
  }
  box.innerHTML=html||'<div class="hempty">找不到符合「'+esc(q)+'」的資料</div>';
}
function goHit(m,id){
  closeSearch(); go(m);
  setTimeout(()=>{
    const el=document.querySelector(`#v-${m} tr[data-id="${id}"]`);
    if(el){el.scrollIntoView({block:'center',behavior:'smooth'});
      el.classList.add('flash');setTimeout(()=>el.classList.remove('flash'),2500);}
  },120);
}

/* ============ Excel 匯出（SheetJS 按需載入） ============ */
let xlsxReady;
function loadXLSX(){
  return xlsxReady ??= new Promise((res,rej)=>{
    const s=document.createElement('script');
    s.src='https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js';
    s.onload=res; s.onerror=()=>{xlsxReady=null;rej(new Error('Excel 元件載入失敗，請檢查網路'))};
    document.head.appendChild(s);
  });
}
async function exportOrders(){
  try{await loadXLSX();}catch(e){toast(e.message);return;}
  const mon=document.getElementById('monOrders').value;
  const rows=(mon&&mon!=='all')?DATA.orders.filter(r=>(r.order_date||'').slice(0,7)===mon):DATA.orders.slice();
  if(!rows.length){toast('沒有可匯出的資料');return;}
  rows.sort((a,b)=>String(a.order_date||'').localeCompare(String(b.order_date||''))||String(a.form_no||'').localeCompare(String(b.form_no||'')));
  const aoa=[['原表單編號','訂貨日期','採購單號','申請單位','品名','數量','單價','總價','到貨','備註'],
    ...rows.map(r=>[r.form_no||'',r.order_date||'',r.po_no||'',r.unit||'',r.item||'',r.quantity??'',r.unit_price??'',r.total_price??'',r.arrived?'已到貨':'未到貨',r.notes||''])];
  const um=new Map();
  rows.forEach(r=>{const k=r.unit||'（未指定）';const g=um.get(k)||{amt:0,qty:0,n:0};
    g.amt+=Number(r.total_price)||0;g.qty+=Number(r.quantity)||0;g.n++;um.set(k,g);});
  const aoa2=[['單位','金額','數量','品項數'],...[...um.entries()].map(([k,g])=>[k,g.amt,g.qty,g.n]),
    ['合計',rows.reduce((s,r)=>s+(Number(r.total_price)||0),0),rows.reduce((s,r)=>s+(Number(r.quantity)||0),0),rows.length]];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:14},{wch:11},{wch:12},{wch:10},{wch:22},{wch:7},{wch:9},{wch:10},{wch:8},{wch:18}];
  const ws2=XLSX.utils.aoa_to_sheet(aoa2); ws2['!cols']=[{wch:12},{wch:12},{wch:8},{wch:8}];
  XLSX.utils.book_append_sheet(wb,ws,'訂貨明細');
  XLSX.utils.book_append_sheet(wb,ws2,'單位小計');
  XLSX.writeFile(wb,`訂貨追蹤_${(mon&&mon!=='all')?mon:'全部'}.xlsx`);
  toast('已匯出 Excel ✓');
}
async function exportAssets(){
  try{await loadXLSX();}catch(e){toast(e.message);return;}
  const rows=DATA.assets.slice().sort(byAssetOrder);
  if(!rows.length){toast('沒有可匯出的資料');return;}
  const aoa=[['使用單位','資材類別','機號/型號','機身條碼','資產編號','目前使用部門','保管人','狀態','備註'],
    ...rows.map(r=>[r.unit||'',r.category||'',r.machine_no||'',r.barcode||'',r.asset_no||'',r.department||'',r.keeper||'',STATUS_LABEL[r.status]||'正常',r.notes||''])];
  const wb=XLSX.utils.book_new();
  const ws=XLSX.utils.aoa_to_sheet(aoa); ws['!cols']=[{wch:13},{wch:11},{wch:12},{wch:15},{wch:15},{wch:14},{wch:14},{wch:8},{wch:20}];
  XLSX.utils.book_append_sheet(wb,ws,'資材清單');
  const d=new Date(),pad=n=>String(n).padStart(2,'0');
  XLSX.writeFile(wb,`資材清單_${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}.xlsx`);
  toast('已匯出 Excel ✓');
}

/* ============ Toast ============ */
let toastT;
function toast(msg){
  const el=document.getElementById('toast');el.textContent=msg;el.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>el.classList.remove('show'),2200);
}
